name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Never auto-download a different toolchain: each job must run on exactly
  # the Go version it set up, or fail loudly.
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (Go ${{ matrix.go }}, TypeScript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # go.mod: the minimum version the module promises to support. Only a
        #         go.mod bump can change what this leg runs.
        # stable: the newest Go release, so a toolchain change that breaks the
        #         library (e.g. a stdlib type becoming an alias) surfaces here
        #         first instead of in a user's build.
        go: ['go.mod', 'stable']
        # Use the locked native compiler by default; keep a TypeScript 5 leg
        # so generated contracts remain usable by existing clients.
        typescript: ['7']
        include:
          - go: 'go.mod'
            typescript: '5.9.3'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}

      - run: go version

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: testdata/zodruntime/package-lock.json

      - run: npm ci --prefix testdata/zodruntime

      - name: Install TypeScript compatibility compiler
        if: matrix.typescript == '5.9.3'
        run: npm install --prefix testdata/zodruntime --no-save --package-lock=false typescript@5.9.3

      - run: testdata/zodruntime/node_modules/.bin/tsc --version

      - run: go test -race -count=1 ./...

      - name: Test example server and Go validation contracts
        working-directory: examples/start-trpc/server
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Lint on the go.mod floor so a new Go release cannot break this job;
      # bumping go.mod is the moment to check staticcheck compatibility.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1 && staticcheck ./...
